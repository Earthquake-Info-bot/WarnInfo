<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>気象警報ビューアーv2.1.10</title>
<style>
body {
  font-family:"Yu Gothic","YuGothic","メイリオ",sans-serif;
  white-space: pre-wrap;
  margin: 5px;
  padding: 5px;
  background: #fff;
  font-size: 14px;

}
#eew { 
  margin: 0; 
  padding: 0; 
  font-family:"Yu Gothic","YuGothic","メイリオ",sans-serif;
  white-space: pre-wrap;
  word-break: break-all;      /* ←これが一番効く */
  overflow-wrap: anywhere;   /* ←保険 */
}

  font-size: 12px;
  padding: 2px 5px;
  margin-bottom: 0px;
  cursor: pointer;
}
#areaSelect {
  font-size: 12px;
  padding: 10px 10px;
  margin-bottom: 0px;
  cursor: pointer;
}
.hidden {
  display: none;
}
</style>
</head>
<body>
<div id="updateTime">取得日時: ----/--/-- --:--:--</div>
<button id="copyBtn">&nbsp;<br>　　　本文をコピー　　　<br>&nbsp;</button>
<select id="areaSelect">

  <optgroup label="北海道地方">

    <option>渡島・檜山地方</option>
  </optgroup>
  <optgroup label="東北地方">
    <option>青森県</option>
    <option>岩手県</option>

    <option>秋田県</option>
    <option>山形県</option>
    <option>福島県</option>
  </optgroup>
  <optgroup label="関東甲信地方">
    <option>茨城県</option>
    <option>栃木県</option>
    <option>群馬県</option>
    <option>埼玉県</option>
    <option>千葉県</option>
    <option>東京都</option>
    <option>神奈川県</option>
    <option>山梨県</option>
    <option>長野県</option>
  </optgroup>
  <optgroup label="東海地方">
    <option>岐阜県</option>
    <option>静岡県</option>
    <option>愛知県</option>
    <option>三重県</option>
  </optgroup>
  <optgroup label="北陸地方">
    <option>新潟県</option>
    <option>富山県</option>
    <option>石川県</option>
    <option>福井県</option>
  </optgroup>
  <optgroup label="近畿地方">
    <option>滋賀県</option>
    <option>京都府</option>
    <option>大阪府</option>
    <option>兵庫県</option>

    <option>和歌山県</option>
  </optgroup>
  <optgroup label="中国地方">
    <option>鳥取県</option>
    <option>島根県</option>

  </optgroup>
  <optgroup label="四国地方">
    <option>徳島県</option>

    <option>高知県</option>
  </optgroup>
  <optgroup label="九州北部地方（山口県を含む）">
    <option>山口県</option>
    <option>福岡県</option>
    <option>佐賀県</option>
    <option>長崎県</option>
    <option>熊本県</option>
    <option>大分県</option>
  </optgroup>
  <optgroup label="九州南部・奄美地方">
    <option>宮崎県</option>
    <option>鹿児島県（奄美地方を除く）</option>
    <option>奄美地方（鹿児島県）</option>
  </optgroup>
  <optgroup label="沖縄地方">
    <option>沖縄本島地方</option>
    <option>大東島地方</option>

    <option>八重山地方</option>
  </optgroup>
</select>

<label><input type="radio" name="mode" value="all"> 全情報</label>
<label><input type="radio" name="mode" value="keihou" checked> 警報以上</label>
<label><input type="radio" name="mode" value="kiken_keihou"> 危険警報以上</label>

<pre id="eew">読み込み中...</pre>

<script>
function setNowTime() {
  const now = new Date();

  const YYYY = now.getFullYear();
  const MM = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const HH = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');

  document.getElementById("updateTime").textContent =
    `取得日時: ${YYYY}/${MM}/${dd} ${HH}:${mm}:${ss}`;
}

setNowTime();
  
async function main(mode=2,taisho_chiiki="全国") {
  try {
const warnArea = {
  "00":{name:"解除",level:null},
  "02":{name:"暴風雪警報",level:3},
  "03":{name:"レベル３大雨警報",level:3},
  "04":{name:"洪水警報",level:3},
  "05":{name:"暴風警報",level:3},
  "06":{name:"大雪警報",level:3},
  "07":{name:"波浪警報",level:3},
  "08":{name:"レベル３高潮警報",level:3},
  "09":{name:"レベル３土砂災害警報",level:3},
  "10":{name:"レベル２大雨注意報",level:2},
  "12":{name:"大雪注意報",level:2},
  "13":{name:"風雪注意報",level:2},
  "14":{name:"雷注意報",level:2},
  "15":{name:"強風注意報",level:2},
  "16":{name:"波浪注意報",level:2},
  "17":{name:"融雪注意報",level:2},
  "18":{name:"洪水注意報",level:2},
  "19":{name:"レベル２高潮注意報",level:2},
  "20":{name:"濃霧注意報",level:2},
  "21":{name:"乾燥注意報",level:2},
  "22":{name:"なだれ注意報",level:2},
  "23":{name:"低温注意報",level:2},
  "24":{name:"霜注意報",level:2},
  "25":{name:"着氷注意報",level:2},
  "26":{name:"着雪注意報",level:2},
  "27":{name:"その他の注意報",level:2},
  "29":{name:"レベル２土砂災害注意報",level:2},
  "32":{name:"暴風雪特別警報",level:5},
  "33":{name:"レベル５大雨特別警報",level:5},
  "35":{name:"暴風特別警報",level:5},
  "36":{name:"大雪特別警報",level:5},
  "37":{name:"波浪特別警報",level:5},
  "38":{name:"レベル５高潮特別警報",level:5},
  "39":{name:"レベル５土砂災害特別警報",level:5},
  "42":{name:"未定・予約",level:null},
  "43":{name:"レベル４大雨危険警報",level:4},
  "45":{name:"未定・予約",level:null},
  "46":{name:"未定・予約",level:null},
  "47":{name:"未定・予約",level:null},
  "48":{name:"レベル４高潮危険警報",level:4},
  "49":{name:"レベル４土砂災害危険警報",level:4}
};

    const {warnData,regionReportDT} = await getCityWarningsByArea(warnArea,taisho_chiiki);
    const data = warnData;

    const dt = new Date(regionReportDT || data.reportDatetime);
    const MM = String(dt.getMonth() + 1).padStart(2, '0');
    const dd = String(dt.getDate()).padStart(2, '0');
    const HH = String(dt.getHours()).padStart(2, '0');
    const mm = String(dt.getMinutes()).padStart(2, '0');

    let titleKind = "";
    if (mode===2) titleKind = "気象警報・注意報";
    else if (mode===3) titleKind = "気象警報";
    else if (mode===4) titleKind = "気象危険/特別警報";
    let titleArea1 = "";  let titleArea2 = "";
    if (taisho_chiiki==="全国") titleArea1 = "全国の"
    else titleArea2 = "\n"+taisho_chiiki

    let text = `《${titleArea1}${titleKind}》${titleArea2}\n${MM}月${dd}日${HH}時${mm}分`;
    if (regionReportDT) text += " 発表"
    else text += " 更新"
    let count = 0;

    for (const warnName in data.warnInfo) {
      const areas = data.warnInfo[warnName];
      if (Object.keys(areas).length === 0) continue;

      const info = Object.values(warnArea).find(w => w.name === warnName);
      if (!info || info.level < mode) continue;

      let block = "";
      let hasArea = false;

      for (const areaName in areas) {
        if (taisho_chiiki !== "全国" && areaName !== taisho_chiiki) continue;

        const cities = areas[areaName];
        if (!cities || cities.length === 0) continue;

        if (!hasArea) {
          const coloredName = `${getWarnColor(info.level)}${warnName}${getWarnColor(info.level)}`;
          block += `\n\n${coloredName}`;
          hasArea = true;
          count++;
        }

        block += `\n【${areaName}】\n`;
        block += cities.join("　");
      }

      text += block;
    }

    if (count===0) {
      if (mode===2) text += "\n\n発表中の気象警報・注意報等はありません。";
      else if (mode===3) text += "\n\n発表中の気象警報はありません。";
      else if (mode===4) text += "\n\n発表中の危険警報・特別警報はありません。";
    }

    document.getElementById("eew").textContent = text.trim();
  } catch(e) {
    document.getElementById("eew").textContent = e;
  }
}

async function getCityWarningsByArea(warnArea,taisho_chiiki="全国") {
  const res = await fetch('https://www.jma.go.jp/bosai/warning/data/warning/map.json');
  const dataJson = await res.json();

  // 結果格納用（キーは警報名）
  const warnByTypeAndArea = {
    "レベル５大雨特別警報":{}, "レベル５土砂災害特別警報":{}, "レベル５高潮特別警報":{},
    "暴風雪特別警報":{}, "暴風特別警報":{}, "大雪特別警報":{}, "波浪特別警報":{},
    "レベル４大雨危険警報":{}, "レベル４土砂災害危険警報":{}, "レベル４高潮危険警報":{},
    "レベル３大雨警報":{}, "レベル３土砂災害警報":{}, "レベル３高潮警報":{},
    "洪水警報":{}, "暴風雪警報":{}, "暴風警報":{}, "大雪警報":{}, "波浪警報":{},
    "レベル２大雨注意報":{}, "レベル２土砂災害注意報":{}, "レベル２高潮注意報":{},
    "大雪注意報":{}, "風雪注意報":{}, "雷注意報":{}, "強風注意報":{}, "波浪注意報":{}, "融雪注意報":{},
    "洪水注意報":{}, "濃霧注意報":{}, "乾燥注意報":{}, "なだれ注意報":{}, "低温注意報":{}, "霜注意報":{},
    "着氷注意報":{}, "着雪注意報":{}, "その他の注意報":{}
  };
  let reportDatetime = "";
  let regionReportDT = "";

  for (const item of dataJson) {
    if (!item.areaTypes || item.areaTypes.length < 2) continue;
    if (reportDatetime==="") {
      reportDatetime = item.reportDatetime;
    } else if (item.reportDatetime > reportDatetime) {
      reportDatetime = item.reportDatetime;
    }

    let largeAreaCode;
    const firstAreaCode = item.areaTypes[0].areas?.[0]?.code;

    if (firstAreaCode) {
      // まずトップレベルキーにあるか確認
      if (chihoData[firstAreaCode]?.name) {
        largeAreaCode = chihoData[firstAreaCode].name;
      } else {
        // children 配列の中を検索
        const found = Object.values(chihoData).find(obj => obj.children.includes(firstAreaCode));
        if (found) {
          largeAreaCode = found.name;
        } else {
          largeAreaCode = firstAreaCode; // 見つからなければコードをそのまま
        }
      }
    } else {
      largeAreaCode = "不明地方"; // areas が空の場合
    }

    if (largeAreaCode && taisho_chiiki===largeAreaCode) regionReportDT = item.reportDatetime || "NaN";

    for (const area of item.areaTypes[1].areas || []) {
      const cityInfo = data[area.code];
      if (!cityInfo) continue;
      const cityName = cityInfo.name;

      for (const w of area.warnings || []) {
        if (!w.code || w.status === "解除") continue;

        const info = warnArea[w.code];
        if (!info) continue;

        const warnName = info.name; // ← データ用
        if (!warnName) continue;

        if (!warnByTypeAndArea[warnName][largeAreaCode]) {
          warnByTypeAndArea[warnName][largeAreaCode] = [];
        }

        warnByTypeAndArea[warnName][largeAreaCode].push(cityName);
      }
    }
  }

  const warnData = {"reportDatetime":reportDatetime,"warnInfo":warnByTypeAndArea};

  return {warnData,regionReportDT};
}

function getWarnColor(level) {
  switch (level) {
    case 2: return "🟨";
    case 3: return "🟥";
    case 4: return "🟪";
    case 5: return "⬛️";
    default: return "◆";
  }
}

window.addEventListener("load", update);

document.getElementById("copyBtn").addEventListener("click", async () => {
  const btn = document.getElementById("copyBtn");
  const text = document.getElementById("eew").textContent;

  try {
    await navigator.clipboard.writeText(text);
    alert("コピー完了")
  } catch(e) {
    alert("ERROR\n"+e)
  }
});

// ラジオ
document.querySelectorAll('input[name="mode"]').forEach(radio => {
  radio.addEventListener("change", update);
});

// セレクト
document.getElementById("areaSelect").addEventListener("change", update);

function update() {
  // レベル取得
  const value = document.querySelector('input[name="mode"]:checked').value;
  let mode;
  if (value === "all") mode = 2;
  else if (value === "keihou") mode = 3;
  else if (value === "kiken_keihou") mode = 4;

  // 地域取得
  const area = document.getElementById("areaSelect")
    .selectedOptions[0].textContent.trim();

  // まとめて渡す
  main(mode, area);
}
</script>
</body>
</html>
