<script>
function setNowTime() {
  const now = new Date();

  const YYYY = now.getFullYear();
  const MM = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const HH = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');

  document.getElementById("updateTime").textContent =
    `取得日時: ${YYYY}/${MM}/${dd} ${HH}:${mm}:${ss}`;
}

setNowTime();

  try {

    const {warnData,regionReportDT} = await getCityWarningsByArea(warnArea,taisho_chiiki);
    const data = warnData;

    const dt = new Date(regionReportDT || data.reportDatetime);
    const MM = String(dt.getMonth() + 1).padStart(2, '0');
    const dd = String(dt.getDate()).padStart(2, '0');
    const HH = String(dt.getHours()).padStart(2, '0');
    const mm = String(dt.getMinutes()).padStart(2, '0');

    let titleKind = "";
    if (mode===2) titleKind = "気象警報・注意報";
    else if (mode===3) titleKind = "気象警報";
    else if (mode===4) titleKind = "気象危険/特別警報";
    let titleArea1 = "";  let titleArea2 = "";
    if (taisho_chiiki==="全国") titleArea1 = "全国の"
    else titleArea2 = "\n"+taisho_chiiki

    let text = `《${titleArea1}${titleKind}》${titleArea2}\n${MM}月${dd}日${HH}時${mm}分`;
    if (regionReportDT) text += " 発表"
    else text += " 更新"
    let count = 0;

    for (const warnName in data.warnInfo) {
      const areas = data.warnInfo[warnName];
      if (Object.keys(areas).length === 0) continue;

      const info = Object.values(warnArea).find(w => w.name === warnName);
      if (!info || info.level < mode) continue;

      let block = "";
      let hasArea = false;

      for (const areaName in areas) {
        if (taisho_chiiki !== "全国" && areaName !== taisho_chiiki) continue;

        const cities = areas[areaName];
        if (!cities || cities.length === 0) continue;

        if (!hasArea) {
          const coloredName = `${getWarnColor(info.level)}${warnName}${getWarnColor(info.level)}`;
          block += `\n\n${coloredName}`;
          hasArea = true;
          count++;
        }

        block += `\n【${areaName}】\n`;
        block += cities.join("　");
      }

      text += block;
    }

    if (count===0) {
      if (mode===2) text += "\n\n発表中の気象警報・注意報等はありません。";
      else if (mode===3) text += "\n\n発表中の気象警報はありません。";
      else if (mode===4) text += "\n\n発表中の危険警報・特別警報はありません。";
    }

    document.getElementById("eew").textContent = text.trim();
  } catch(e) {
    document.getElementById("eew").textContent = e;
  }
}

      reportDatetime = item.reportDatetime;
    } else if (item.reportDatetime > reportDatetime) {
      reportDatetime = item.reportDatetime;
    }

    let largeAreaCode;
    const firstAreaCode = item.areaTypes[0].areas?.[0]?.code;

    if (firstAreaCode) {
      // まずトップレベルキーにあるか確認
      if (chihoData[firstAreaCode]?.name) {
        largeAreaCode = chihoData[firstAreaCode].name;
      } else {
        // children 配列の中を検索
        const found = Object.values(chihoData).find(obj => obj.children.includes(firstAreaCode));
        if (found) {
          largeAreaCode = found.name;
        } else {
          largeAreaCode = firstAreaCode; // 見つからなければコードをそのまま
        }
      }
    } else {
      largeAreaCode = "不明地方"; // areas が空の場合
    }

    if (largeAreaCode && taisho_chiiki===largeAreaCode) regionReportDT = item.reportDatetime || "NaN";

    for (const area of item.areaTypes[1].areas || []) {
      const cityInfo = data[area.code];
      if (!cityInfo) continue;
      const cityName = cityInfo.name;

      for (const w of area.warnings || []) {
        if (!w.code || w.status === "解除") continue;

        const info = warnArea[w.code];
        if (!info) continue;

        const warnName = info.name; // ← データ用
        if (!warnName) continue;

        if (!warnByTypeAndArea[warnName][largeAreaCode]) {
          warnByTypeAndArea[warnName][largeAreaCode] = [];
        }

        warnByTypeAndArea[warnName][largeAreaCode].push(cityName);
      }
    }
  }

  const warnData = {"reportDatetime":reportDatetime,"warnInfo":warnByTypeAndArea};

  return {warnData,regionReportDT};

function getWarnColor(level) {
  switch (level) {
    case 2: return "🟨";
    case 3: return "🟥";
    case 4: return "🟪";
    case 5: return "⬛️";
    default: return "◆";
  }
}

window.addEventListener("load", update);

document.getElementById("copyBtn").addEventListener("click", async () => {
  const btn = document.getElementById("copyBtn");
  const text = document.getElementById("eew").textContent;

  try {
    await navigator.clipboard.writeText(text);
    alert("コピー完了")
  } catch(e) {
    alert("ERROR\n"+e)
  }
});

// ラジオ
document.querySelectorAll('input[name="mode"]').forEach(radio => {
  radio.addEventListener("change", update);
});

// セレクト
document.getElementById("areaSelect").addEventListener("change", update);

function update() {
  // レベル取得
  const value = document.querySelector('input[name="mode"]:checked').value;
  let mode;
  if (value === "all") mode = 2;
  else if (value === "keihou") mode = 3;
  else if (value === "kiken_keihou") mode = 4;

  // 地域取得
  const area = document.getElementById("areaSelect")
    .selectedOptions[0].textContent.trim();

  // まとめて渡す
  main(mode, area);
}
</script>
</body>
</html>
